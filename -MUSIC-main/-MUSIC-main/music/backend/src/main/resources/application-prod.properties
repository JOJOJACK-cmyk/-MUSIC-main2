# ============================================================
# 운영 프로필 (SPRING_PROFILES_ACTIVE=prod)
# application.properties 의 값을 덮어쓴다.
# 비밀값은 모두 환경변수(docker-compose.prod.yml → .env)로 주입한다. 이 파일에 직접 쓰지 말 것.
# ============================================================

# 리버스 프록시(Caddy) 뒤에서 원래 스킴/호스트를 인식
server.forward-headers-strategy=framework

# 데이터베이스 (도커 네트워크 내부)
spring.datasource.url=jdbc:mysql://mysql:3306/music_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=redis
spring.data.redis.port=6379

spring.jpa.show-sql=false

# SRS - 공개 HLS 주소 / 내부 API 주소 / OBS 송출 주소
hls.base-url=https://streamwavekr.duckdns.org
srs.api.base-url=http://srs:1985
srs.rtmp-url=rtmp://54.116.174.95/live

# HTTPS 환경 세션 쿠키 보안
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

youtube.api.key=
youtube.api.keys=${YOUTUBE_API_KEYS}

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# AWS 자격증명은 S3Config 의 DefaultCredentialsProvider 가 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 로 읽는다
aws.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.cloudfront.domain=${AWS_CLOUDFRONT_DOMAIN}

toss.payments.client-key=${TOSS_CLIENT_KEY}
toss.payments.secret-key=${TOSS_SECRET_KEY}

# 소셜 로그인 리다이렉트 + CORS 허용 origin
app.frontend-url=https://streamwavekr.duckdns.org
app.cors.allowed-origins=https://streamwavekr.duckdns.org

logging.level.root=INFO
