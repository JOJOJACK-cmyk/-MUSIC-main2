# ============================================================
# music 프로덕션 스택 (Oracle Cloud ARM / Ubuntu 22.04 기준)
# 위치: music/docker-compose.prod.yml  (backend, frontend, infra 와 같은 레벨)
# 실행: docker compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:

  # ----------------------------------------------------------
  # MySQL
  # 외부 포트를 열지 않는다. 백엔드만 도커 네트워크로 접근한다.
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: music-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: music_db
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ----------------------------------------------------------
  # Redis
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: music-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------
  # SRS (라이브 스트리밍)
  #   1935 : RTMP  → OBS 가 외부에서 송출해야 하므로 전체 공개
  #   1985 : SRS HTTP API → 127.0.0.1 만. 외부 공개 시 누구나 방송 강제종료 가능
  #   8080 : HLS → 포트 자체를 공개하지 않고 Caddy 가 /live 로 프록시
  # ----------------------------------------------------------
  srs:
    image: ossrs/srs:6
    container_name: music-srs
    restart: always
    ports:
      - "1935:1935"
      - "127.0.0.1:1985:1985"
    volumes:
      - ./infra/srs/srs.prod.conf:/usr/local/srs/conf/music.conf:ro
      - ./infra/srs/snapshot.sh:/usr/local/srs/conf/snapshot.sh:ro
    command:
      - ./objs/srs
      - -c
      - conf/music.conf

  # ----------------------------------------------------------
  # Spring Boot
  # 외부 포트를 열지 않는다. Caddy 만 접근한다.
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: music-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul

      APP_HOST: ${APP_HOST}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      YOUTUBE_API_KEYS: ${YOUTUBE_API_KEYS}

      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_CLOUDFRONT_DOMAIN: ${AWS_CLOUDFRONT_DOMAIN}

      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}

  # ----------------------------------------------------------
  # Caddy (리버스 프록시 + 정적 프론트 + 자동 HTTPS)
  # 프론트 빌드 결과물이 이미지 안에 포함된다.
  # ----------------------------------------------------------
  caddy:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: music-caddy
    restart: always
    depends_on:
      - backend
      - srs
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config: