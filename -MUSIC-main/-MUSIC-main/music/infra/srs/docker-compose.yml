services:
  srs:
    image: ossrs/srs:6
    container_name: music-srs

    ports:
      # RTMP
      - "1935:1935"

      # SRS HTTP API
      - "1985:1985"

      # HLS
      - "8081:8080"

    volumes:
      - ./srs.conf:/usr/local/srs/conf/music.conf:ro

    command:
      - ./objs/srs
      - -c
      - conf/music.conf

    restart: unless-stopped