listen              1935;
max_connections     1000;

daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {

    http_hooks {
        enabled         on;

        # 프로덕션: 백엔드가 같은 docker-compose 네트워크의 'backend' 서비스로 떠 있으므로
        # host.docker.internal 대신 서비스명으로 접근한다.
        on_publish      http://backend:8080/api/broadcast/srs/callback;
        on_unpublish    http://backend:8080/api/broadcast/srs/callback;
    }

    hls {
        enabled         on;

        hls_path        ./objs/nginx/html;

        # HLS 조각 길이
        hls_fragment    1;

        # 재생목록에 유지할 총 시간
        hls_window      6;
    }

    # 라이브 미리보기 썸네일 자동 생성 (conf/snapshot.sh 가 2분마다 한 프레임 캡처)
    #  - 방송이 끊기면 SRS 가 이 프로세스를 종료함
    exec {
        enabled         on;
        publish         /bin/sh /usr/local/srs/conf/snapshot.sh [stream];
    }
}
