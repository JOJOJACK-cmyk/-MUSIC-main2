listen              1935;
max_connections     1000;

daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {

    http_hooks {
        enabled         on;

        # 실제 방송 시작/종료를 백엔드로 알려서 DB 상태(ON/OFF)와 투표 데이터를 자동 동기화
        # host.docker.internal = 컨테이너 안에서 호스트 PC(백엔드가 떠있는 곳)를 가리키는 주소
        on_publish      http://host.docker.internal:8080/api/broadcast/srs/callback;
        on_unpublish    http://host.docker.internal:8080/api/broadcast/srs/callback;
    }

    hls {
        enabled         on;

        hls_path        ./objs/nginx/html;

        # HLS 조각 길이
        hls_fragment    1;

        # 재생목록에 유지할 총 시간
        hls_window      6;
    }
}